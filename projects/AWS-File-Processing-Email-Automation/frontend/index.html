<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles if needed, but Tailwind handles most of it */
        body { font-family: 'Inter', sans-serif; } /* Ensure Inter font is used */
    </style>
</head>
<body class="font-sans bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="container bg-white p-8 rounded-lg shadow-xl max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-blue-700 mb-4">Upload Your File</h1>
        <p class="text-gray-600 mb-6">Select a file to upload to the cloud and receive an email notification.</p>
        
        <form id="uploadForm" class="space-y-4">
            <div class="form-group text-left">
                <label for="fileInput" class="block text-gray-700 text-sm font-semibold mb-2">Choose File:</label>
                <input type="file" id="fileInput" name="file" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        
            <button type="submit" class="submit-button w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Upload File
            </button>
        </form>

        <div id="message" class="message mt-6 p-3 rounded-md hidden text-sm font-medium"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
