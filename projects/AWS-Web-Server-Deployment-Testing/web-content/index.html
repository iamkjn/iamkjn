<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven Classics Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-2xl w-full transform transition-all duration-500 hover:scale-105">
        <h1 class="text-5xl font-extrabold text-gray-800 mb-6 animate-fade-in-down">
            Welcome to <span class="text-purple-700">Heaven Classics</span>
        </h1>
        <p class="text-xl text-gray-600 mb-8 animate-fade-in-up">
            Your website is now successfully running on an <span class="font-bold text-blue-600">AWS EC2 Instance</span>
            behind an <span class="font-bold text-green-600">Application Load Balancer</span>!
        </p>
        <div class="space-y-4">
            <p class="text-lg text-gray-700">
                This page confirms your web server setup is complete and accessible.
            </p>
            <p class="text-md text-gray-500">
                Served by IIS on Windows Server 2022.
            </p>
        </div>
        <div class="mt-10">
            <a href="#" class="inline-block bg-purple-600 text-white text-lg font-semibold py-3 px-8 rounded-full shadow-lg hover:bg-purple-700 transition-transform transform hover:scale-110">
                Learn More About Our Cloud Solutions
            </a>
        </div>
    </div>
</body>
</html>
